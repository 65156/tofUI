<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tofUI Apply Report - test-apply-report</title>
    <style>
        :root {
    --bg-page: #f8f7f5;
    --bg-surface: #ffffff;
    --bg-muted: #f3f2ef;
    --bg-header: #4b5563;
    --text-primary: #18181b;
    --text-secondary: #52525b;
    --text-muted: #71717a;
    --text-tertiary: #a1a1aa;
    --border: #d4d1cb;
    --border-strong: #9ca3af;
    --accent-create: #2563eb;
    --accent-update: #d97706;
    --accent-delete: #dc2626;
    --accent-replace: #6d28d9;
    --accent-read: #9ca3af;
    --chip-create-bg: #dbeafe;
    --chip-create-fg: #1e40af;
    --chip-update-bg: #fef3c7;
    --chip-update-fg: #92400e;
    --chip-delete-bg: #fee2e2;
    --chip-delete-fg: #991b1b;
    --chip-replace-bg: #ede9fb;
    --chip-replace-fg: #4c1d95;
    --diff-add-bg: #dbeafe;
    --diff-add-fg: #1e40af;
    --diff-del-bg: #fee2e2;
    --diff-del-fg: #991b1b;
    --diff-mod-bg: #fef3c7;
    --diff-mod-fg: #92400e;
    --terminal-bg: #1e1e1e;
    --terminal-fg: #d4d4d4;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 10px;
}

/* Explicit Maze postMessage override — dark */
:root[data-theme="dark"] {
    --bg-page: #09090b;
    --bg-surface: #111113;
    --bg-muted: #18181b;
    --bg-header: #27272a;
    --text-primary: #fafafa;
    --text-secondary: #a1a1aa;
    --text-muted: #71717a;
    --text-tertiary: #52525b;
    --border: #2a2a2f;
    --border-strong: #52525b;
    --accent-create: #3b82f6;
    --accent-update: #f59e0b;
    --accent-delete: #ef4444;
    --accent-replace: #7c3aed;
    --accent-read: #52525b;
    --chip-create-bg: #0c1a2e;
    --chip-create-fg: #93c5fd;
    --chip-update-bg: #1c1000;
    --chip-update-fg: #fcd34d;
    --chip-delete-bg: #1f0808;
    --chip-delete-fg: #fca5a5;
    --chip-replace-bg: #1a0a3d;
    --chip-replace-fg: #c4b5fd;
    --diff-add-bg: #0c1a2e;
    --diff-add-fg: #93c5fd;
    --diff-del-bg: #1f0808;
    --diff-del-fg: #fca5a5;
    --diff-mod-bg: #1c1000;
    --diff-mod-fg: #fcd34d;
    --terminal-bg: #010409;
    --terminal-fg: #e6edf3;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.6);
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 10px;
}

/* OS/browser preference fallback when no explicit data-theme is set */
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg-page: #09090b;
    --bg-surface: #111113;
    --bg-muted: #18181b;
    --bg-header: #27272a;
    --text-primary: #fafafa;
    --text-secondary: #a1a1aa;
    --text-muted: #71717a;
    --text-tertiary: #52525b;
    --border: #2a2a2f;
    --border-strong: #52525b;
    --accent-create: #3b82f6;
    --accent-update: #f59e0b;
    --accent-delete: #ef4444;
    --accent-replace: #7c3aed;
    --accent-read: #52525b;
    --chip-create-bg: #0c1a2e;
    --chip-create-fg: #93c5fd;
    --chip-update-bg: #1c1000;
    --chip-update-fg: #fcd34d;
    --chip-delete-bg: #1f0808;
    --chip-delete-fg: #fca5a5;
    --chip-replace-bg: #1a0a3d;
    --chip-replace-fg: #c4b5fd;
    --diff-add-bg: #0c1a2e;
    --diff-add-fg: #93c5fd;
    --diff-del-bg: #1f0808;
    --diff-del-fg: #fca5a5;
    --diff-mod-bg: #1c1000;
    --diff-mod-fg: #fcd34d;
    --terminal-bg: #010409;
    --terminal-fg: #e6edf3;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.6);
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 10px;
    }
}
        
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background-color: var(--bg-page);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbars — Maze style */
        ::-webkit-scrollbar              { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track        { background: transparent; }
        ::-webkit-scrollbar-thumb        { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover  { background: var(--border-strong); }

        .container {
            width: 100%;
            background: var(--bg-surface);
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-header);
            color: #fff;
            padding: 1rem;
            text-align: center;
        }

        .known-after-apply {
            color: var(--accent-create);
            font-style: italic;
            opacity: 0.8;
        }

        .known-after-apply-cell {
            background: var(--diff-add-bg) !important;
            color: var(--diff-add-fg);
        }

        .plan-name {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 300;
            margin-bottom: 0.3rem;
        }

        .meta-info {
            opacity: 0.9;
            font-size: 0.85rem;
            font-weight: 300;
        }

        /* State card — shared by no-changes, error, apply summary */
        .state-card {
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .state-card__icon {
            display: flex;
            justify-content: center;
            margin-bottom: 0.75rem;
            color: var(--text-muted);
        }
        .state-card__icon svg {
            width: 2rem;
            height: 2rem;
        }
        .state-card__title {
            margin: 0 0 0.5rem 0;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .state-card__body {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        .state-card--nochange .state-card__icon { color: var(--accent-create); }
        .state-card--error   .state-card__icon { color: var(--accent-delete); }
        .state-card--error .state-card__title  { color: var(--accent-delete); }

        .summary-stats {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .stat-item {
            text-align: center;
            padding: 0.4rem 0.6rem;
            border-radius: var(--radius-sm);
            background: var(--bg-muted);
            min-width: 52px;
        }
        .stat-item.create {
            background: var(--diff-add-bg);
            color: var(--diff-add-fg);
        }
        .stat-item.update {
            background: var(--diff-mod-bg);
            color: var(--diff-mod-fg);
        }
        .stat-item.delete {
            background: var(--diff-del-bg);
            color: var(--diff-del-fg);
        }
        .stat-number {
            display: block;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .stat-label {
            font-size: 0.54rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ── Toolbar (single sticky row: search + chips + icon buttons) ──── */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 0.5rem 0.6rem;
            padding: 0.45rem 0.8rem;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .toolbar-search {
            position: relative;
            flex: 1 1 180px;
            min-width: 140px;
        }
        #resource-search {
            width: 100%;
            height: 30px;
            padding: 0 1.8rem 0 0.7rem;
            font-size: 0.82rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
            box-sizing: border-box;
            background: var(--bg-muted);
            color: var(--text-primary);
        }
        #resource-search:focus {
            border-color: var(--border-strong);
            background: var(--bg-surface);
        }
        .search-clear {
            position: absolute;
            right: 0.4rem;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            color: var(--text-tertiary);
            font-size: 0.78rem;
            line-height: 1;
            padding: 0.2rem;
            display: none;
        }
        .search-clear.visible { display: block; }

        .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            height: 26px;
            padding: 0 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            border-left: 3px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
            transition: background 0.1s ease, color 0.1s ease;
        }
        .chip:not(.active):hover { background: var(--bg-muted); }
        .chip.active { color: var(--text-primary); border-color: transparent; }
        .chip.active[data-action="delete"]  { background: var(--chip-delete-bg);  border-left-color: var(--accent-delete);  color: var(--chip-delete-fg); }
        .chip.active[data-action="replace"] { background: var(--chip-replace-bg); border-left-color: var(--accent-replace); color: var(--chip-replace-fg); }
        .chip.active[data-action="update"]  { background: var(--chip-update-bg);  border-left-color: var(--accent-update);  color: var(--chip-update-fg); }
        .chip.active[data-action="create"]  { background: var(--chip-create-bg);  border-left-color: var(--accent-create);  color: var(--chip-create-fg); }
        .chip-count {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            background: rgba(0,0,0,0.06);
            border-radius: var(--radius-sm);
            padding: 0 0.3rem;
        }
        .chip.active .chip-count { background: rgba(0,0,0,0.10); }

        /* Toolbar right cluster: count + icon buttons */
        .toolbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            flex-shrink: 0;
        }
        .results-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            padding-right: 0.35rem;
        }
        .toolbar-icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-surface);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0;
            transition: background 0.1s ease, color 0.1s ease;
            flex-shrink: 0;
        }
        .toolbar-icon-btn:hover { background: var(--bg-muted); color: var(--text-primary); }
        .toolbar-icon-btn[aria-expanded="true"] { background: var(--bg-muted); color: var(--text-primary); }

        /* Properties dropdown panel */
        .props-panel {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 0.55rem 0.8rem;
        }
        .props-panel[hidden] { display: none; }
        .props-panel__inner {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.8rem;
        }
        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .filter-checkbox input { margin: 0; cursor: pointer; }

        /* Filter active notice */
        .no-results {
            display: none;
            padding: 2rem 1rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .no-results.visible { display: block; }
        .filter-notice {
            display: none;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 0.8rem;
            background: var(--diff-mod-bg);
            border-bottom: 1px solid var(--border);
            color: var(--diff-mod-fg);
            font-size: 0.78rem;
            font-weight: 500;
        }
        .filter-notice.visible { display: flex; }
        .filter-notice-icon { flex-shrink: 0; }
        .filter-reset {
            margin-left: auto;
            border: 1px solid var(--border-strong);
            background: transparent;
            color: var(--diff-mod-fg);
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
        }
        .filter-reset:hover { opacity: 0.8; }
        .resource-change.highlighted {
            box-shadow: 0 0 0 2px var(--accent-replace);
            border-radius: var(--radius-md);
        }

        /* ── Resource groups ─────────────────────────────────────────────── */
        .resource-groups { padding: 0.6rem; }

        .resource-group {
            margin-bottom: 0.35rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .group-header {
            background: var(--bg-muted);
            padding: 0.35rem 0.65rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .group-header h3 {
            margin: 0;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }

        .group-resources { padding: 0.35rem; }

        .resource-change {
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 0.3rem;
            overflow: hidden;
        }

        .resource-change.create  { border-left: 4px solid var(--accent-create); }
        .resource-change.update  { border-left: 4px solid var(--accent-update); }
        .resource-change.delete  { border-left: 4px solid var(--accent-delete); }
        .resource-change.replace { border-left: 4px solid var(--accent-replace); }
        .resource-change.read    { border-left: 4px solid var(--accent-read); }

        .resource-header {
            padding: 0.45rem 0.7rem;
            background: var(--bg-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            user-select: none;
            min-height: 34px;
        }
        .resource-header:hover { background: var(--border); }

        .resource-address {
            font-family: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.8rem;
            font-weight: 500;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .toggle-indicator {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            transition: transform 0.2s;
        }
        .toggle-indicator svg { width: 16px; height: 16px; }

        .resource-change.collapsed .toggle-indicator {
            transform: rotate(-90deg);
        }

        .resource-details {
            padding: 0;
            border-top: 1px solid var(--border);
        }

        .resource-change.collapsed .resource-details { display: none; }

        /* Outputs Section */
        .outputs-section {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border);
        }
        .outputs-section h2 {
            margin: 0 0 1rem 0;
            color: var(--text-secondary);
            font-size: 1.4rem;
        }

        .outputs-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .output-item {
            background: var(--bg-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .output-name {
            background: var(--border);
            padding: 0.75rem;
            font-family: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-strong);
        }
        .output-details { padding: 0.75rem; }
        .output-value {
            margin: 0 0 0.5rem 0;
            font-family: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-x: auto;
        }
        .output-type {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-top: 0.5rem;
        }
        .sensitive-value {
            color: var(--text-muted);
            font-style: italic;
            background: var(--bg-muted);
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
        }

        .command-box {
            background: var(--bg-muted);
            border-radius: var(--radius-md);
            padding: 0.2rem;
            margin: 0.2rem 0;
        }
        .command {
            background: var(--terminal-bg);
            color: var(--terminal-fg);
            padding: 0.6rem 0.8rem;
            border-radius: var(--radius-sm);
            font-family: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
            margin-top: 0.75rem;
        }

        /* Terminal Section */
        .terminal-section {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border);
        }
        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .terminal-header h3 {
            margin: 0;
            color: var(--text-secondary);
        }
        .copy-btn {
            background: var(--text-muted);
            color: var(--bg-surface);
            border: none;
            padding: 0.4rem 0.85rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .copy-btn:hover { opacity: 0.8; }
        .terminal-container {
            background: var(--terminal-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        .terminal-output {
            background: var(--terminal-bg);
            color: var(--terminal-fg);
            padding: 1.5rem;
            margin: 0;
            font-family: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        /* Properties diff table */
        .properties-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            table-layout: fixed;
        }
        .properties-table th {
            background: var(--bg-muted);
            padding: 0.75rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border-strong);
            position: relative;
        }

        /* Resizable Before/After columns */
        .resizable-table { --before-w: 37.5%; --after-w: 37.5%; }
        .resizable-table .col-prop { width: 25%; }
        .resizable-table .col-before { width: var(--before-w); }
        .resizable-table .col-after { width: var(--after-w); }
        .resource-change.delete .resizable-table { --before-w: 52%; --after-w: 23%; }
        .resource-change.create .resizable-table { --before-w: 23%; --after-w: 52%; }
        .resizable-table .before-value,
        .resizable-table .after-value { width: auto; max-width: none; }
        .col-resizer {
            position: absolute;
            top: 0;
            right: -5px;
            width: 10px;
            height: 100%;
            cursor: col-resize;
            z-index: 2;
        }
        .col-resizer::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 20%;
            height: 60%;
            width: 2px;
            transform: translateX(-50%);
            background: var(--border-strong);
        }
        .col-resizer:hover::after,
        .col-resizer.dragging::after { background: var(--text-tertiary); }

        .properties-table td {
            padding: 0.5rem;
            border-bottom: 1px solid var(--border-strong);
            vertical-align: top;
        }
        .property-name {
            font-family: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
            font-weight: 500;
            color: var(--text-secondary);
            width: 25%;
        }
        .before-value, .after-value {
            width: 37.5%;
            max-width: 37.5%;
            min-width: 0;
        }
        .before-value pre, .after-value pre {
            margin: 0;
            font-family: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            max-width: 100%;
            overflow: auto;
            background: var(--bg-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.5rem;
        }
        .before-value pre.long-value, .after-value pre.long-value {
            font-size: 0.68rem;
            white-space: pre;
            word-break: normal;
        }
        .long-simple-value {
            font-family: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.8rem;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            max-width: 100%;
            padding: 0.5rem;

    <script>
        // ── tofUI Maze theme bridge ──────────────────────────────────────────
        (function () {
            var root = document.documentElement;
            // Restore last known theme immediately (avoids flash)
            try {
                var saved = localStorage.getItem('tofui-theme');
                if (saved === 'dark' || saved === 'light') root.dataset.theme = saved;
            } catch (e) {}

            window.addEventListener('message', function (e) {
                if (!e.data || e.data.type !== 'theme') return;
                var t = e.data.value;
                if (t !== 'dark' && t !== 'light') return;
                root.dataset.theme = t;
                try { localStorage.setItem('tofui-theme', t); } catch (e) {}
            });
        })();
        </script>

<body>

    <script>
        const TOFUI_LOG_URL = null;
        
        // Initialize the apply page
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize collapsible elements
            collapseAllResources();
            
            // Auto-load logs
            autoLoadLogs();
        });
        
        function autoLoadLogs() {
            // Try different log locations based on environment
            const baseName = window.location.pathname.split('/').pop().replace('.html', '');
            
            const logUrls = [
                // Explicit URL (e.g. a signed bucket URL) wins when provided
                ...(typeof TOFUI_LOG_URL !== 'undefined' && TOFUI_LOG_URL ? [TOFUI_LOG_URL] : []),
                `${baseName}.log`,  // Local: same directory
                `../logs/${baseName}.log`,  // GitHub Pages: logs folder
                `logs/${baseName}.log`  // Alternative GitHub Pages path
            ];
            
            tryLoadLog(logUrls, 0);
        }
        
        function filterTerraformLogs(logContent) {
            const lines = logContent.split('\n');
            
            // Look for trigger lines to start from
            const triggerPatterns = [
                'Terraform will perform the following actions:',
                'Terraform planned the following actions, but then encountered a problem:',
                'No changes. Your infrastructure matches the configuration.'
            ];
            
            let startIndex = -1;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                for (const pattern of triggerPatterns) {
                    if (line.includes(pattern)) {
                        startIndex = i;
                        break;
                    }
                }
                if (startIndex !== -1) break;
            }
            
            // If no trigger found, return original content
            if (startIndex === -1) {
                return logContent;
            }
            
            // Return content starting from the trigger line
            return lines.slice(startIndex).join('\n');
        }
        
        function tryLoadLog(urls, index) {
            if (index >= urls.length) {
                document.getElementById('terminal-output').textContent = 
                    'Error: Log file not found in any expected location\nTried:\n' + urls.join('\n');
                return;
            }
            
            fetch(urls[index])
                .then(response => {
                    if (!response.ok) throw new Error('Not found');
                    return response.text();
                })
                .then(data => {
                    const filteredData = filterTerraformLogs(data);
                    document.getElementById('terminal-output').textContent = filteredData;
                })
                .catch(() => tryLoadLog(urls, index + 1));
        }
        
        function toggleResource(header) {
            const resourceChange = header.closest('.resource-change');
            resourceChange.classList.toggle('collapsed');
        }
        
        function collapseAllResources() {
            const resources = document.querySelectorAll('.resource-change');
            resources.forEach(resource => {
                resource.classList.add('collapsed');
            });
        }
        
        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;
            
            navigator.clipboard.writeText(text).then(function() {
                // Show feedback
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                btn.style.background = '#6c757d';
                
                setTimeout(function() {
                    btn.textContent = originalText;
                    btn.style.background = '#6c757d';
                }, 2000);
            }).catch(function(err) {
                console.error('Could not copy text: ', err);
                alert('Failed to copy to clipboard');
            });
        }
        
    </script>
